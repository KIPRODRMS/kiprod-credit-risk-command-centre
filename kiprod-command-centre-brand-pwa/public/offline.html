<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071426" />
    <title>KIPROD Command Centre — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #071426;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 460px; text-align: center; }
      img { width: 92px; height: 92px; border-radius: 24px; }
      h1 { margin: 24px 0 8px; font-size: 28px; }
      p { margin: 0 auto 24px; color: #b8c8d8; line-height: 1.6; }
      button {
        border: 1px solid #40d8d9;
        border-radius: 999px;
        padding: 12px 22px;
        background: #19c7c9;
        color: #071426;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You’re currently offline</h1>
      <p>
        Reconnect to securely load the latest portfolio, risk, and governance
        information.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
